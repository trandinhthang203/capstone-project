<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Streaming Demo</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 780px; margin: 48px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: 10px; align-items: flex-end; }
    label { flex: 1; }
    textarea { box-sizing: border-box; width: 100%; min-height: 90px; padding: 12px; resize: vertical; }
    button { min-height: 42px; padding: 0 18px; cursor: pointer; }
    #stop { display: none; }
    #status { min-height: 1.5em; margin: 14px 0 6px; color: #777; }
    #answer { min-height: 150px; padding: 18px; border: 1px solid #8886; border-radius: 8px;
      white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    .cursor::after { content: "▋"; animation: blink .7s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <h1>Streaming response từ LLM</h1>
  <form id="chat-form">
    <label>Câu hỏi
      <textarea id="message" required placeholder="Nhập câu hỏi..."></textarea>
    </label>
    <button id="send" type="submit">Gửi</button>
    <button id="stop" type="button">Dừng</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="answer" aria-live="polite"></div>

  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const answer = document.querySelector('#answer');
    const status = document.querySelector('#status');
    const sendButton = document.querySelector('#send');
    const stopButton = document.querySelector('#stop');
    let controller = null;

    function setLoading(loading) {
      sendButton.disabled = loading;
      input.disabled = loading;
      stopButton.style.display = loading ? 'inline-block' : 'none';
      answer.classList.toggle('cursor', loading);
    }

    function handleEvent(eventName, rawData) {
      const data = JSON.parse(rawData);
      if (eventName === 'token') answer.textContent += data.text;
      if (eventName === 'status' || eventName === 'done') status.textContent = data.message;
      if (eventName === 'error') throw new Error(data.message);
    }

    async function readSSE(response) {
      if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
      if (!response.body) throw new Error('Trình duyệt không hỗ trợ streaming response.');

      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        buffer += value || '';
        const blocks = buffer.split(/\r?\n\r?\n/);
        buffer = blocks.pop() || '';
        for (const block of blocks) {
          let eventName = 'message';
          const dataLines = [];
          for (const line of block.split(/\r?\n/)) {
            if (line.startsWith('event:')) eventName = line.slice(6).trim();
            if (line.startsWith('data:')) dataLines.push(line.slice(5).trimStart());
          }
          if (dataLines.length) handleEvent(eventName, dataLines.join('\n'));
        }
        if (done) break;
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      controller = new AbortController();
      answer.textContent = '';
      status.textContent = 'Đang kết nối...';
      setLoading(true);
      try {
        const response = await fetch('/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
          body: JSON.stringify({ message }),
          signal: controller.signal,
        });
        await readSSE(response);
      } catch (error) {
        status.textContent = error.name === 'AbortError' ? 'Đã dừng.' : `Lỗi: ${error.message}`;
      } finally {
        controller = null;
        setLoading(false);
        input.disabled = false;
        input.focus();
      }
    });

    stopButton.addEventListener('click', () => controller?.abort());
  </script>
</body>
</html>
