<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>OnlyOffice Editor</title>
</head>
<body>

<!-- Vùng chứa editor -->
<div id="ds-frame">Đang tải editor...</div>

<!-- Bước 1: Load SDK -->
<script src="https://docspace-l4ew3k.onlyoffice.com/static/scripts/sdk/2.2.0/api.js"></script>

<!-- Bước 2: Khởi tạo editor -->
<script>
  var docSpace = DocSpace.initEditor({
    frameId: "ds-frame",
    src: "https://docspace-l4ew3k.onlyoffice.com",
    width: "100%",
    height: "700px",
    fileId: "ID_FILE_CỦA_BẠN",   // <-- thay bằng ID file thực tế
    // token: "JWT_TOKEN",        // <-- nếu file private thì cần token
    events: {
      onAppReady: function () {
        console.log("Editor đã sẵn sàng!");
      },
      onAppError: function (err) {
        console.error("Lỗi:", err);
      }
    }
  });
</script>

</body>
</html>
